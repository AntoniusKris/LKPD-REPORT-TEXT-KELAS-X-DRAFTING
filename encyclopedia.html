<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wonder Encyclopedia</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fffdf7;
    --card-radius: 24px;
    --shadow: 0 8px 32px rgba(0,0,0,0.10);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Nunito', sans-serif;
    background: var(--bg);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── HOME SCREEN ── */
  #home {
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 40px 20px 60px;
    background: linear-gradient(160deg, #fff7e6 0%, #ffecd2 50%, #e8f5e9 100%);
  }

  .home-title {
    font-family: 'Fredoka One', cursive;
    font-size: clamp(2.4rem, 8vw, 4rem);
    color: #2d2d2d;
    text-align: center;
    margin-bottom: 6px;
    letter-spacing: 1px;
  }

  .home-subtitle {
    font-size: 1rem;
    color: #888;
    margin-bottom: 40px;
    text-align: center;
    font-weight: 600;
  }

  .topic-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 18px;
    width: 100%;
    max-width: 700px;
  }

  .topic-card {
    background: white;
    border-radius: var(--card-radius);
    padding: 24px 12px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    box-shadow: var(--shadow);
    transition: transform 0.22s cubic-bezier(.34,1.56,.64,1), box-shadow 0.2s;
    border: 3px solid transparent;
    position: relative;
    overflow: hidden;
  }

  .topic-card::before {
    content: '';
    position: absolute;
    inset: 0;
    opacity: 0;
    transition: opacity 0.2s;
    border-radius: calc(var(--card-radius) - 3px);
  }

  .topic-card:hover { transform: translateY(-6px) scale(1.03); box-shadow: 0 16px 40px rgba(0,0,0,0.13); }
  .topic-card:active { transform: scale(0.97); }

  .topic-card .card-emoji {
    font-size: 2.6rem;
    line-height: 1;
    display: block;
    animation: float 3s ease-in-out infinite;
    width: 72px;
    height: 72px;
    object-fit: contain;
  }

  .topic-card:nth-child(2) .card-emoji { animation-delay: 0.3s; }
  .topic-card:nth-child(3) .card-emoji { animation-delay: 0.6s; }
  .topic-card:nth-child(4) .card-emoji { animation-delay: 0.9s; }
  .topic-card:nth-child(5) .card-emoji { animation-delay: 1.2s; }
  .topic-card:nth-child(6) .card-emoji { animation-delay: 1.5s; }
  .topic-card:nth-child(7) .card-emoji { animation-delay: 1.8s; }
  .topic-card:nth-child(8) .card-emoji { animation-delay: 2.1s; }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }

  .card-label {
    font-family: 'Fredoka One', cursive;
    font-size: 0.95rem;
    text-align: center;
    color: #2d2d2d;
    line-height: 1.2;
  }

  .card-tag {
    font-size: 0.68rem;
    font-weight: 700;
    padding: 2px 10px;
    border-radius: 20px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }

  /* card theme colors */
  .card-animal  { border-color: #a8e6cf; background: linear-gradient(135deg, #fff 60%, #e8faf3); }
  .card-animal .card-tag  { background: #a8e6cf; color: #1a6b4a; }
  .card-object  { border-color: #ffd3b6; background: linear-gradient(135deg, #fff 60%, #fff4ec); }
  .card-object .card-tag  { background: #ffd3b6; color: #7a3b1e; }
  .card-food    { border-color: #ffaaa5; background: linear-gradient(135deg, #fff 60%, #fff0ef); }
  .card-food .card-tag    { background: #ffaaa5; color: #7a1e1e; }

  /* ── ARTICLE PAGE ── */
  #article-page {
    display: none;
    min-height: 100vh;
    flex-direction: column;
  }

  .article-header {
    position: relative;
    padding: 32px 24px 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow: hidden;
    min-height: 200px;
    justify-content: flex-end;
  }

  .header-blob {
    position: absolute;
    inset: 0;
    z-index: 0;
    transition: background 0.5s;
  }

  .article-emoji-big {
    font-size: 5rem;
    position: relative;
    z-index: 1;
    filter: drop-shadow(0 8px 16px rgba(0,0,0,0.18));
    animation: bounceIn 0.6s cubic-bezier(.34,1.56,.64,1);
    width: 130px;
    height: 130px;
    object-fit: contain;
  }

  @keyframes bounceIn {
    from { transform: scale(0.3) translateY(40px); opacity: 0; }
    to   { transform: scale(1) translateY(0); opacity: 1; }
  }

  .article-title {
    font-family: 'Fredoka One', cursive;
    font-size: clamp(1.8rem, 6vw, 2.8rem);
    color: white;
    text-align: center;
    position: relative;
    z-index: 1;
    text-shadow: 0 2px 8px rgba(0,0,0,0.18);
    margin-top: 8px;
  }

  .article-category-badge {
    position: relative;
    z-index: 1;
    font-size: 0.75rem;
    font-weight: 800;
    padding: 4px 14px;
    border-radius: 20px;
    background: rgba(255,255,255,0.3);
    color: white;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-top: 8px;
    backdrop-filter: blur(4px);
  }

  /* top nav */
  .top-nav {
    position: absolute;
    top: 16px;
    left: 16px;
    right: 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 10;
  }

  .btn-home {
    background: rgba(255,255,255,0.3);
    border: none;
    border-radius: 50px;
    padding: 8px 16px;
    color: white;
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    font-size: 0.85rem;
    cursor: pointer;
    backdrop-filter: blur(4px);
    transition: background 0.2s, transform 0.15s;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .btn-home:hover { background: rgba(255,255,255,0.5); transform: scale(1.05); }

  .topic-counter {
    background: rgba(255,255,255,0.3);
    border-radius: 20px;
    padding: 6px 14px;
    color: white;
    font-weight: 800;
    font-size: 0.85rem;
    backdrop-filter: blur(4px);
  }

  /* article body */
  .article-body {
    flex: 1;
    padding: 28px 20px 100px;
    max-width: 720px;
    margin: 0 auto;
    width: 100%;
  }

  /* stats bar */
  .stats-bar {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    margin-bottom: 28px;
  }

  @media(min-width: 500px) { .stats-bar { grid-template-columns: repeat(4, 1fr); } }

  .stat-chip {
    background: white;
    border-radius: 16px;
    padding: 14px 10px;
    text-align: center;
    box-shadow: var(--shadow);
    animation: slideUp 0.5s both;
  }

  .stat-chip .stat-val {
    font-family: 'Fredoka One', cursive;
    font-size: 1.1rem;
    color: #2d2d2d;
    display: block;
  }

  .stat-chip .stat-key {
    font-size: 0.68rem;
    font-weight: 700;
    color: #aaa;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  /* sections */
  .section {
    background: white;
    border-radius: var(--card-radius);
    padding: 20px 20px 16px;
    margin-bottom: 18px;
    box-shadow: var(--shadow);
    animation: slideUp 0.5s both;
    border-left: 5px solid var(--accent, #ccc);
  }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .section-title {
    font-family: 'Fredoka One', cursive;
    font-size: 1.15rem;
    color: var(--accent, #333);
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .section p {
    color: #555;
    line-height: 1.7;
    font-size: 0.95rem;
    margin-bottom: 10px;
  }

  .section ul {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .section ul li {
    color: #555;
    font-size: 0.95rem;
    line-height: 1.6;
    padding-left: 22px;
    position: relative;
  }

  .section ul li::before {
    content: '▸';
    color: var(--accent, #ccc);
    position: absolute;
    left: 0;
    font-size: 0.85rem;
    top: 2px;
  }

  .section ul li strong {
    color: #2d2d2d;
    font-weight: 800;
  }

  /* bottom nav */
  .bottom-nav {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 20px;
    background: rgba(255,253,247,0.92);
    backdrop-filter: blur(12px);
    border-top: 2px solid #f0ece0;
    z-index: 100;
  }

  .nav-btn {
    background: white;
    border: 2px solid #eee;
    border-radius: 50px;
    padding: 10px 22px;
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    font-size: 0.9rem;
    cursor: pointer;
    transition: all 0.2s cubic-bezier(.34,1.56,.64,1);
    display: flex;
    align-items: center;
    gap: 6px;
    color: #2d2d2d;
  }

  .nav-btn:hover { transform: scale(1.06); box-shadow: 0 4px 16px rgba(0,0,0,0.1); }
  .nav-btn:disabled { opacity: 0.3; cursor: not-allowed; transform: none; }
  .nav-btn.next-btn { background: var(--accent, #ccc); color: white; border-color: transparent; }

  .nav-topic-name {
    font-family: 'Fredoka One', cursive;
    font-size: 0.95rem;
    color: #888;
    text-align: center;
    flex: 1;
    padding: 0 8px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* page transition */
  .fade-enter { animation: fadeIn 0.4s both; }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateX(30px); }
    to   { opacity: 1; transform: translateX(0); }
  }
  .fade-exit { animation: fadeOut 0.25s both; }
  @keyframes fadeOut {
    from { opacity: 1; }
    to   { opacity: 0; }
  }

  /* coming soon */
  .coming-soon {
    text-align: center;
    padding: 60px 20px;
    color: #bbb;
    font-family: 'Fredoka One', cursive;
    font-size: 1.4rem;
  }
  .coming-soon span { display: block; font-size: 3rem; margin-bottom: 12px; }
</style>
</head>

let current = 0;

function goHome() {
  const ap = document.getElementById('article-page');
  ap.style.animation = 'fadeOut 0.25s both';
  setTimeout(() => {
    ap.style.display = 'none';
    ap.style.animation = '';
    document.getElementById('home').style.display = 'flex';
  }, 220);
}

function openTopic(idx) {
  current = idx;
  document.getElementById('home').style.display = 'none';
  const ap = document.getElementById('article-page');
  ap.style.display = 'flex';
  renderTopic();
  ap.classList.add('fade-enter');
  setTimeout(() => ap.classList.remove('fade-enter'), 400);
  window.scrollTo(0, 0);
}

function navigate(dir) {
  const ap = document.getElementById('article-page');
  ap.style.opacity = '0';
  ap.style.transition = 'opacity 0.18s';
  setTimeout(() => {
    current = Math.max(0, Math.min(topics.length - 1, current + dir));
    renderTopic();
    ap.style.opacity = '1';
    window.scrollTo(0, 0);
  }, 180);
}

function renderTopic() {
  const t = topics[current];

  // header
  document.getElementById('headerBlob').style.background = t.gradient;
  const emojiEl = document.getElementById('articleEmoji');
  emojiEl.src = t.img;
  emojiEl.alt = t.title;
  document.getElementById('articleTitle').textContent = t.title;
  document.getElementById('articleCategory').textContent = t.category;
  document.getElementById('topicCounter').textContent = `${current + 1} / ${topics.length}`;

  // nav buttons
  document.getElementById('prevBtn').disabled = current === 0;
  document.getElementById('nextBtn').disabled = current === topics.length - 1;

  // middle label: show adjacent topic
  const adj = current < topics.length - 1 ? topics[current + 1] : topics[current - 1];
  document.getElementById('navTopicName').textContent = adj ? adj.title : '';

  // accent css var
  document.getElementById('article-page').style.setProperty('--accent', t.accent);

  // body
  const body = document.getElementById('articleBody');

  if (t.sections.length === 0) {
    body.innerHTML = `<div class="coming-soon"><span>${t.emoji}</span>Content coming soon!<br><small style="font-size:0.9rem;font-family:'Nunito',sans-serif;color:#ccc;">Paste the content and I'll add it right away.</small></div>`;
    return;
  }

  let html = '';

  // stats
  if (t.stats.length) {
    html += `<div class="stats-bar">`;
    t.stats.forEach((s, i) => {
      html += `<div class="stat-chip" style="animation-delay:${i*0.08}s">
        <span class="stat-val">${s.val}</span>
        <span class="stat-key">${s.key}</span>
      </div>`;
    });
    html += `</div>`;
  }

  // sections
  t.sections.forEach((sec, i) => {
    html += `<div class="section" style="--accent:${t.accent};animation-delay:${0.1 + i*0.07}s">
      <div class="section-title">${sec.icon} ${sec.title}</div>
      ${sec.content}
    </div>`;
  });

  body.innerHTML = html;
}
</script>
